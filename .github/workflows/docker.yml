name: Build and Push Image to Docker Hub

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write


jobs:
    publish_images:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Log in to Docker Hub
              uses: docker/login-action@v2
              with:
                username: darkcompiler
                password: e982f17bcbe0f724063b708a4f76db211a999304
            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                context: .
                push: true
                tags: darkcompiler/azubigoemailtool:latest

    